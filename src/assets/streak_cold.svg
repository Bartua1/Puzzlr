    <use href="#frozen-flame-core"/>
  </g>
  <!-- Floating Ice Crystals -->
  <path d="M68 25 L70 28 L72 25 L70 22 Z" fill="#ffffff" />
  <path d="M26 65 L27.5 67.5 L29 65 L27.5 62.5 Z" fill="#ffffff" opacity="0.8"/>
  
  <defs>
    <radialGradient id="glow-cold-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-cold-1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
    <!-- Core Frozen Flame Design -->
    <g id="frozen-flame-core">
